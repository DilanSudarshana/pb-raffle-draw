<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,shrink-to-fit=no" />

    <meta name="description" content="People's Bank Raffle Draw" />
    <meta name="author" content="People's Bank" />

    <title>PB-RAFFLE-DRAW</title>

    <!-- Sansation Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sansation:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/logo/logo.jpg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/src/assets/logo/logo.jpg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/logo/logo.jpg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/logo/logo.jpg" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Material Design Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
      rel="stylesheet"
    />

    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png" />
    <meta name="theme-color" content="#ffffff" />

    <!-- CoreUI Theme -->
    <script>
      const userMode = localStorage.getItem('coreui-free-vue-admin-template-theme')

      const systemDarkMode =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches

      if (userMode === 'dark' || (userMode !== 'light' && systemDarkMode)) {
        document.documentElement.dataset.coreuiTheme = 'dark'
      }
    </script>

    <!-- Apply Sansation -->
    <style>
      html,
      body,
      #app {
        font-family: 'Sansation', sans-serif;
      }

      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <noscript>
      <strong>
        We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it
        to continue.
      </strong>
    </noscript>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
